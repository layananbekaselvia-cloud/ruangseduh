let TT=[],ttCE=false,ttHook=()=>{},ttPersist=()=>{};
const myJab=()=>has('Waka Kesiswaan')?'Waka Kesiswaan':has('Wali Kelas')?'Wali Kelas '+(S.u.kelasWali||''):(S.u.roles[0]||'Guru');
function ttBlock(l){return`<div style="display:flex;flex-wrap:wrap;justify-content:space-around;gap:14px 10px;margin-top:22px;color:#000;font-family:'Times New Roman',serif;font-size:14px">${l.map(s=>`<div style="width:46%;min-width:190px;text-align:center">${s.m?'Mengetahui,<br>':''}${E(s.jab)}<div style="height:74px;display:flex;align-items:center;justify-content:center">${s.img?`<img src="${s.img}" style="max-height:72px;max-width:100%">`:''}</div><b>${E(s.nama)}</b><br>${s.nip?'NIP.'+E(s.nip):''}</div>`).join('')}</div>`}
function pad(cb){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000c;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px';
d.innerHTML=`<div class="card" style="width:100%;max-width:420px"><h3>✍️ Tanda tangan di layar</h3><canvas width="380" height="160" style="width:100%;border:3px solid var(--ink);border-radius:12px;background:#fff;touch-action:none"></canvas><button id="ps">Simpan</button><button class="g" id="pc">Hapus</button><button class="r" id="px">Batal</button></div>`;document.body.appendChild(d);
const c=d.querySelector('canvas'),x=c.getContext('2d');x.lineWidth=2.6;x.lineCap='round';let dr=false;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{dr=true;x.beginPath();x.moveTo(...pt(e));c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(dr){x.lineTo(...pt(e));x.stroke()}};c.onpointerup=()=>dr=false;
d.querySelector('#pc').onclick=()=>x.clearRect(0,0,c.width,c.height);d.querySelector('#px').onclick=()=>d.remove();d.querySelector('#ps').onclick=()=>{cb(c.toDataURL('image/png'));d.remove()}}
function ttEditor(ce){const d=ce?'':'disabled';return`<h3>✍️ Penandatangan</h3>${TT.map((s,i)=>`<div style="border:2px dashed var(--mid);padding:6px;margin-bottom:6px"><div class="row"><div><label>Jabatan/peran</label><input ${d} value="${E(s.jab)}" oninput="TT[${i}].jab=this.value;ttHook()"></div><div><label>Nama</label><input ${d} value="${E(s.nama)}" oninput="TT[${i}].nama=this.value;ttHook()"></div><div><label>NIP</label><input ${d} value="${E(s.nip)}" oninput="TT[${i}].nip=this.value;ttHook()"></div></div>
<label><input type="checkbox" style="width:auto;margin:0" ${s.m?'checked':''} ${d} onchange="TT[${i}].m=this.checked;ttHook()"> Awali dengan "Mengetahui,"</label><br><button class="t" onclick="signAt(${i})">✍️ Tanda tangan di layar</button>${s.img?`<button class="g" onclick="TT[${i}].img='';ttHook();ttRe();ttPersist()">Hapus ttd</button>`:''}${ce?`<button class="r" onclick="TT.splice(${i},1);ttHook();ttRe()">Hapus penandatangan</button>`:''}</div>`).join('')}
${ce?`<button class="g" onclick="ttAdd('kep')">+ Kepala Sekolah</button><button class="g" onclick="ttAdd('me')">+ Saya (${E(S.u.nama)})</button><button class="g" onclick="ttAdd('')">+ Orang lain</button>`:''}`}
const ttRe=()=>{const e=$('#tte');if(e)e.innerHTML=ttEditor(ttCE)};
function ttAdd(k){TT.push(k=='kep'?{jab:'Kepala '+(SK().nama||''),nama:SK().ksNama||'',nip:SK().ksNip||'',m:1,img:''}:k=='me'?{jab:myJab(),nama:S.u.nama,nip:S.u.nip,m:0,img:''}:{jab:'',nama:'',nip:'',m:0,img:''});ttRe();ttHook()}
function signAt(i){pad(img=>{TT[i].img=img;ttHook();ttRe();ttPersist()})}
// ===== SURAT RESMI KASUS (Panggilan Ortu, Mediasi, SP) =====
const SJ=['Panggilan Orang Tua','Undangan Mediasi','Surat Peringatan 1','Surat Peringatan 2','Surat Peringatan 3'];
const fT=(d,wd)=>d?new Date(d).toLocaleDateString('id-ID',{weekday:wd?'long':undefined,day:'numeric',month:'long',year:'numeric'}):'…';
let SKid=0;
function openSurat(id){SKid=id;const k=D.kasus.find(x=>x.id==id),s=k.surat||{},w=has('Waka Kesiswaan'),back=has('Waka Kesiswaan','Kepala Sekolah')?'kesiswaan':'kasus';
if(!w&&!k.surat)return toast('Belum ada surat untuk kasus ini');
const jd=s.jenis||(/SP\) 1/.test(k.tindakan)?SJ[2]:/SP\) 2/.test(k.tindakan)?SJ[3]:/SP\) 3/.test(k.tindakan)?SJ[4]:/Mediasi/.test(k.tindakan)?SJ[1]:SJ[0]);

ttCE=w;ttHook=rSurat;ttPersist=()=>{if(k.surat){k.surat.ttd=TT;save('kasus')}};
$('#m').innerHTML=`<button class="g" onclick="go('${back}')">← Kembali</button>${w?`<div class="card"><h2>📨 Surat Resmi</h2><p><b>${E(k.nama)}</b> (${E(k.kelas)}) — ${E(k.jenis)}</p><label>Jenis surat</label><select id="zj" onchange="rSurat()">${o(SJ,jd)}</select>
<div class="row"><div><label>Nomor surat</label><input id="zn" value="${E(s.no||'')}" oninput="rSurat()" placeholder="mis. 421.3/012/2026"></div><div><label>Tanggal surat</label><input id="zt" type="date" value="${s.tgl||today()}" oninput="rSurat()"></div></div>
<div class="row"><div><label>Tanggal pertemuan</label><input id="zp" type="date" value="${s.tglP||''}" oninput="rSurat()"></div><div><label>Jam</label><input id="zh" value="${E(s.jam||'08.00 WIB')}" oninput="rSurat()"></div><div><label>Tempat</label><input id="zl" value="${E(s.tmp||'Ruang Kesiswaan')}" oninput="rSurat()"></div></div>
<label>Alamat (dipakai hanya jika kop belum diatur admin di Setelan)</label><input id="za" value="${E(s.alamat||ls('alamat')||'')}" oninput="rSurat()"><label>Foto bukti surat/panggilan (kamera atau galeri)</label><input id="zf" type="file" accept="image/*"></div>`:''}
<div class="card"><div id="tte">${ttEditor(w)}</div>${w?`<button onclick="saveSurat()">💾 Simpan ke catatan kasus</button>`:'<small>Kamu bisa menandatangani bagianmu lalu tanda tangan tersimpan otomatis.</small>'}</div>
<div class="card"><div id="suratBox" class="paper"></div>${dlb('suratBox','surat-'+id)}</div>${k.fotoSurat?`<div class="card"><h3>Bukti surat/panggilan</h3><img class="ft" src="${k.fotoSurat}"></div>`:''}`;rSurat()}
function sv(){const k=D.kasus.find(x=>x.id==SKid);return has('Waka Kesiswaan')?{jenis:$('#zj').value,no:$('#zn').value,tgl:$('#zt').value,tglP:$('#zp').value,jam:$('#zh').value,tmp:$('#zl').value,alamat:$('#za').value}:k.surat}
function rSurat(){const k=D.kasus.find(x=>x.id==SKid),v=sv(),sp=SJ.indexOf(v.jenis),n=E(k.nama),pl=`${E(k.jenis)}${k.catatan?' ('+E(k.catatan)+')':''}`;let isi;
const tr=(a,b)=>`<tr><td style="border:0;text-align:left">${a}</td><td style="border:0;text-align:left">: ${b}</td></tr>`;
if(sp<2)isi=`<p>Dengan hormat,</p><p style="text-align:justify">Sehubungan dengan permasalahan yang melibatkan putra/putri Bapak/Ibu, <b>${n}</b> (kelas ${E(k.kelas)}), berupa ${pl} pada ${fT(k.tgl,1)}, kami mohon kehadiran Bapak/Ibu ${sp==1?'untuk mengikuti mediasi bersama pihak-pihak terkait':'untuk berdiskusi mengenai pembinaan ananda'} pada:</p><table style="border:0;margin-left:20px;width:auto">${tr('Hari/Tanggal',fT(v.tglP,1))}${tr('Pukul',E(v.jam))}${tr('Tempat',E(v.tmp))}</table><p style="text-align:justify">Mengingat pentingnya hal tersebut, kehadiran Bapak/Ibu sangat kami harapkan. Demikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih.</p>`;
else{const t=['pertama','kedua','ketiga'][sp-2],l=['Apabila pelanggaran terulang, sekolah akan memberikan peringatan lanjutan.','Apabila pelanggaran terulang, sekolah akan menindaklanjuti sesuai tata tertib sekolah dan ketentuan yang berlaku.','Ini merupakan peringatan tertulis terakhir; pelanggaran berikutnya akan ditindaklanjuti sesuai tata tertib sekolah dan ketentuan yang berlaku.'][sp-2];
isi=`<p>Dengan hormat,</p><p style="text-align:justify">Berdasarkan catatan kesiswaan, <b>${n}</b> (kelas ${E(k.kelas)}) telah melakukan pelanggaran tata tertib sekolah berupa ${pl} pada ${fT(k.tgl,1)}. Sehubungan dengan itu, sekolah memberikan <b>Surat Peringatan ${sp-1}</b> sebagai teguran tertulis ${t}.</p><p style="text-align:justify">Kami berharap ananda memperbaiki sikap dan Bapak/Ibu turut membimbing di rumah. ${l}</p><p>Demikian surat ini disampaikan agar menjadi perhatian.</p>`}
const ttw=TT.concat([{jab:'Orang Tua/Wali Murid',nama:'(..................)',nip:'',m:0,img:''}]);
$('#suratBox').innerHTML=`${kop(v.alamat)}<div style="font-family:'Times New Roman',serif;color:#000;font-size:14px"><p style="text-align:right">${fT(v.tgl)}</p><table style="border:0;width:auto">${tr('Nomor',E(v.no)||'…')}${tr('Lampiran','-')}${tr('Perihal','<b>'+E(v.jenis)+'</b>')}</table><p>Kepada Yth.<br>Bapak/Ibu Orang Tua/Wali Murid dari ${n}<br>Kelas ${E(k.kelas)}<br>di tempat</p>${isi}${ttBlock(ttw)}</div>`}
function saveSurat(){const k=D.kasus.find(x=>x.id==SKid),v=sv(),f=$('#zf').files[0];ls('alamat',v.alamat);v.ttd=TT;k.surat=v;if(!k.tl)k.tl=v.jenis+' diterbitkan '+v.tgl;const d=()=>{save('kasus');toast('Surat tersimpan di catatan kasus');openSurat(SKid)};f?foto(f,u=>{k.fotoSurat=u;d()}):d()}
// ===== TATA USAHA: agenda surat + surat resmi umum =====
let tuSub='agenda',AG=null,agF='Semua';const SK_LETTER=['Undangan','Surat Keterangan','Surat Tugas','Pemberitahuan','Surat Edaran','Lainnya'];
function vTU(){const w=has('Tata Usaha');$('#m').innerHTML=`<div class="row"><button class="${tuSub=='agenda'?'':'g'}" onclick="tuSub='agenda';AG=null;vTU()">🗂️ Agenda Surat</button><button class="${tuSub=='buat'?'':'g'}" onclick="tuSub='buat';vTU()" ${(w||AG)?'':'disabled'}>✉️ Surat Resmi</button></div>`+(tuSub=='agenda'?tuAgenda(w):tuBuat())}
function tuAgenda(w){const L=D.agenda.filter(x=>agF=='Semua'||x.jenis==agF);
return(w?`<div class="card"><h3>➕ Catat surat masuk / keluar</h3><div class="row"><div><label>Jenis</label><select id="aj"><option>Masuk</option><option>Keluar</option></select></div><div><label>Nomor surat</label><input id="an"></div><div><label>Tgl surat</label><input id="at2" type="date" value="${today()}"></div><div><label>Tgl diterima/dikirim</label><input id="at3" type="date" value="${today()}"></div></div><label>Asal / Tujuan</label><input id="ap"><label>Perihal</label><input id="ah"><label>Keterangan</label><input id="ak2"><label>Foto/scan surat (kamera atau galeri)</label><input id="af" type="file" accept="image/*"><button onclick="saveAg()">Simpan ke agenda</button></div>`:'')+
`<div class="card"><label>Tampilkan</label><select onchange="agF=this.value;vTU()">${o(['Semua','Masuk','Keluar'],agF)}</select><div id="agBox" class="paper">${kop()}<h3 style="text-align:center">AGENDA SURAT ${agF=='Semua'?'MASUK & KELUAR':agF.toUpperCase()}</h3><table><tr><th>No Agenda</th><th>Jenis</th><th>Nomor Surat</th><th>Tgl Surat</th><th>Asal/Tujuan</th><th>Perihal</th><th>Ket</th></tr>${L.map(x=>`<tr><td>${x.agenda}</td><td>${x.jenis}</td><td>${E(x.nomor)}</td><td>${x.tglS}</td><td>${E(x.pihak)}</td><td>${E(x.perihal)}</td><td>${E(x.ket)}</td></tr>`).join('')}</table></div>${dlb('agBox','agenda-surat')}</div>`+
L.slice().reverse().map(x=>`<div class="card"><b>${x.agenda}</b> <span class="chip">${x.jenis}</span> ${E(x.perihal)}<br>${x.surat?`<button class="g" onclick="AG=${x.id};tuSub='buat';vTU()">📄 Buka surat / tanda tangan</button>`:''}${x.foto?`<img class="ft" src="${x.foto}" style="max-width:160px">`:''}${w?`<button class="r" onclick="delAg(${x.id})">Hapus</button>`:''}</div>`).join('')}
function nomAg(j,tgl){return String(D.agenda.filter(x=>x.jenis==j&&x.tglS.slice(0,4)==tgl.slice(0,4)).length+1).padStart(3,'0')}
function saveAg(){const j=$('#aj').value,x={id:Date.now(),jenis:j,agenda:nomAg(j,$('#at2').value),nomor:$('#an').value,tglS:$('#at2').value,tgl2:$('#at3').value,pihak:$('#ap').value,perihal:$('#ah').value,ket:$('#ak2').value};if(!x.perihal)return toast('Isi perihal');const f=$('#af').files[0],d=()=>{D.agenda.push(x);save('agenda');vTU()};f?foto(f,u=>{x.foto=u;d()}):d()}
function delAg(id){D.agenda=D.agenda.filter(x=>x.id!=id);save('agenda');vTU()}
function tuBuat(){const w=has('Tata Usaha'),it=AG?D.agenda.find(x=>x.id==AG):null,s=it?it.surat:{},d=w?'':'disabled';
TT=s.ttd&&s.ttd.length?JSON.parse(JSON.stringify(s.ttd)):(w?[{jab:'Kepala '+(SK().nama||''),nama:SK().ksNama||'',nip:SK().ksNip||'',m:0,img:''}]:[]);
ttCE=w;ttHook=rLetter;ttPersist=()=>{if(it){it.surat.ttd=TT;save('agenda')}};setTimeout(()=>{rLetter();refAiq()},0);
return`<div class="card"><h2>✉️ Surat Resmi</h2><div class="row"><div><label>Jenis</label><select id="lj" ${d} onchange="rLetter()">${o(SK_LETTER,s.kind)}</select></div><div><label>Nomor surat</label><input id="ln" ${d} value="${E(s.no||'')}" oninput="rLetter()"></div><div><label>Tanggal</label><input id="ld" type="date" ${d} value="${s.tgl||today()}" oninput="rLetter()"></div></div>
<div class="row"><div><label>Tempat (kota)</label><input id="lk" ${d} value="${E(s.tempat||ls('tempat')||'')}" oninput="rLetter()"></div><div><label>Lampiran</label><input id="ll" ${d} value="${E(s.lamp||'-')}" oninput="rLetter()"></div></div>
<label>Perihal</label><input id="lp" ${d} value="${E(s.perihal||'')}" oninput="rLetter()"><label>Kepada Yth.</label><input id="lt" ${d} value="${E(s.tujuan||'')}" oninput="rLetter()" placeholder="mis. Bapak/Ibu Guru dan Staf"><label>Isi surat (satu paragraf per baris)</label><textarea id="li" rows="6" ${d} oninput="rLetter()">${E(s.isi||'')}</textarea>${w?`<button class="t" onclick="aiLetter()">🤖 Susun isi dengan AI (dari poin-poin di atas)</button><span class="chip aiq"></span>`:''}<div id="tte">${ttEditor(w)}</div>${w?`<button onclick="saveLetter()">💾 Simpan & catat di agenda</button>`:''}</div><div class="card"><div id="lbox" class="paper"></div>${dlb('lbox','surat-resmi')}</div>`}
function lv(){return{kind:$('#lj').value,no:$('#ln').value,tgl:$('#ld').value,tempat:$('#lk').value,lamp:$('#ll').value,perihal:$('#lp').value,tujuan:$('#lt').value,isi:$('#li').value}}
function rLetter(){if(!$('#lbox'))return;const v=lv(),tr=(a,b)=>`<tr><td style="border:0;text-align:left">${a}</td><td style="border:0;text-align:left">: ${b}</td></tr>`;
$('#lbox').innerHTML=`${kop()}<div style="font-family:'Times New Roman',serif;color:#000;font-size:14px"><p style="text-align:right">${E(v.tempat)}${v.tempat?', ':''}${fT(v.tgl)}</p><table style="border:0;width:auto">${tr('Nomor',E(v.no)||'…')}${tr('Lampiran',E(v.lamp))}${tr('Hal','<b>'+E(v.perihal)+'</b>')}</table><p>Yth. ${E(v.tujuan)}<br>di tempat</p>${v.isi.split('\n').filter(x=>x.trim()).map(x=>`<p style="text-align:justify">${E(x)}</p>`).join('')}${ttBlock(TT)}</div>`}
async function aiLetter(){const v=lv();if(!v.perihal)return toast('Isi perihal dan poin-poin dulu');toast('Menyusun isi surat… ☕');try{$('#li').value=(await panggilAI(`Tuliskan isi ${v.kind} resmi sekolah SMP dalam bahasa Indonesia baku. Hanya isi surat (pembuka, isi, penutup), satu paragraf per baris, tanpa kop, tanpa tanda tangan, tanpa markdown. Perihal: ${v.perihal}. Ditujukan kepada: ${v.tujuan}. Poin/rincian dari pengirim: ${v.isi}`)).replace(/[*#]/g,'');rLetter()}catch(e){toast(e.message)}}
function saveLetter(){const v=lv();if(!v.perihal)return toast('Isi perihal');ls('tempat',v.tempat);v.ttd=TT;let it=AG?D.agenda.find(x=>x.id==AG):null;
if(it){it.surat=v;it.perihal=v.perihal;it.pihak=v.tujuan;it.nomor=v.no}else{it={id:Date.now(),jenis:'Keluar',agenda:nomAg('Keluar',v.tgl),nomor:v.no,tglS:v.tgl,tgl2:v.tgl,pihak:v.tujuan,perihal:v.perihal,ket:'',surat:v};D.agenda.push(it);AG=it.id}
save('agenda');toast('Tersimpan & tercatat di agenda')}

// ===== KOP SURAT (per sekolah: teks + logo kiri/kanan) =====
function kop(al){const c=D.kop&&D.kop.n?D.kop:null,T="font-family:'Times New Roman',serif;";
if(!c)return`<div style="text-align:center;border-bottom:4px double #000;padding-bottom:6px;margin-bottom:10px"><b style="${T}font-size:18px">${E((SK().nama||'').toUpperCase())}</b>${al?`<br><i style="${T}font-size:12px">${E(al)}</i>`:''}</div>`;
const lg=s=>s?`<img src="${s}" style="height:72px;max-width:80px;object-fit:contain">`:'';
return`<div style="border-bottom:5px double #000;padding-bottom:6px;margin-bottom:12px"><table style="width:100%;border:0"><tr><td style="border:0;width:84px;text-align:center">${lg(c.l1)}</td><td style="border:0;text-align:center;line-height:1.25;color:#000">${c.p?`<div style="${T}font-weight:bold;font-size:15px">${E(c.p.toUpperCase())}</div>`:''}<div style="${T}font-weight:bold;font-size:20px">${E(c.n.toUpperCase())}</div>${c.k?`<div style="${T}font-weight:bold;font-size:15px">${E(c.k.toUpperCase())}</div>`:''}<div style="${T}font-style:italic;font-size:12px">${E(c.a||'')}</div></td><td style="border:0;width:84px;text-align:center">${lg(c.l2)}</td></tr></table></div>`}
function kopForm(){const c=D.kop||{};setTimeout(kopPrev,0);return`<div class="card"><h2>🖼️ Kop Surat</h2><p style="font-size:12px">Dipakai di surat resmi, rekap absensi, RPL, dan modul ajar. Tiap sekolah mengisi sendiri.</p>
<label>Baris 1 (mis. PEMERINTAH KABUPATEN KATINGAN)</label><input id="kp1" value="${E(c.p||'')}" oninput="kopPrev()"><label>Baris 2 — nama sekolah</label><input id="kp2" value="${E(c.n||SK().nama||'')}" oninput="kopPrev()"><label>Baris 3 (mis. KECAMATAN KATINGAN HILIR)</label><input id="kp3" value="${E(c.k||'')}" oninput="kopPrev()"><label>Alamat</label><input id="kp4" value="${E(c.a||'')}" oninput="kopPrev()">
<div class="row"><div><label>Logo kiri (PNG/JPG)</label><input type="file" accept="image/*" onchange="kopLogo(this,'l1')"></div><div><label>Logo kanan</label><input type="file" accept="image/*" onchange="kopLogo(this,'l2')"></div></div>
<label>Pratinjau</label><div id="kpv" class="paper"></div><button onclick="saveKop()">💾 Simpan kop</button><button class="g" onclick="D.kop.l1='';D.kop.l2='';kopPrev()">Hapus logo</button></div>`}
function kopRead(){D.kop=Object.assign(D.kop||{},{p:$('#kp1').value,n:$('#kp2').value,k:$('#kp3').value,a:$('#kp4').value})}
function kopPrev(){if(!$('#kpv'))return;kopRead();$('#kpv').innerHTML=kop()}
function kopLogo(el,w){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);kopRead();D.kop[w]=c.toDataURL('image/png');kopPrev()};im.src=r.result};r.readAsDataURL(f)}

function attDraw(id){const b=$('#al_'+id);if(!b)return;b.innerHTML=(ATT[id]||[]).map((a,i)=>`<span class="chip">${a.type.startsWith('image/')?'🖼️':'📄'} ${E(a.name)} (${fsz(a.size)}) <a href="#" onclick="ATT['${id}'].splice(${i},1);attDraw('${id}');return false" style="color:var(--cher);font-weight:700;text-decoration:none">✖</a></span>`).join('')||'<small>Belum ada lampiran (boleh dikosongkan).</small>'}
function imgComp(src,cb,max=1280,q=.75){const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};im.onerror=()=>cb(null);im.src=src}
function attPush(id,name,type,data){if(!ATT[id])return;if(ATT[id].length>=MAXN)return toast('Maksimal '+MAXN+' lampiran');const size=Math.round((data.length-data.indexOf(',')-1)*3/4);if(size>MAXF)return toast('Berkas terlalu besar (maks 2 MB): '+name);ATT[id].push({fid:FID(),name,type,size,data});attDraw(id)}

camS={st,id,face};const d=document.createElement('div');d.id='camOv';d.style.cssText='position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px';
d.innerHTML=`<video id="camV" autoplay playsinline muted style="max-width:100%;max-height:70vh;border:3px solid var(--car);border-radius:12px"></video><div class="row" style="max-width:440px"><button onclick="camShot()">📸 Ambil foto</button><button class="g" onclick="camFlip()">🔄 Balik kamera</button><button class="r" onclick="camX()">✖ Selesai</button></div><small style="color:#fff">${face=='user'?'Kamera depan':'Kamera belakang'} aktif · boleh ambil beberapa foto</small>`;document.body.appendChild(d);const v=$('#camV');v.srcObject=st;if(face=='user')v.style.transform='scaleX(-1)'}
function camX(){if(camS){camS.st.getTracks().forEach(t=>t.stop());camS=null}const d=$('#camOv');if(d)d.remove()}

<div class="card"><div id="tmBox" class="paper">${kop()}<h3 style="text-align:center">BUKU TAMU</h3><table><tr><th>Tgl</th><th>Jam</th><th>Nama</th><th>Hubungan</th><th>Murid</th><th>Keperluan</th><th>Catatan</th><th>Menemui</th><th>Lamp.</th></tr>${L.map(x=>`<tr><td>${x.tgl}</td><td>${x.jam}</td><td>${E(x.nama)}</td><td>${x.hub}</td><td>${E(x.murid)}</td><td>${x.priv?'🔒 ':''}${E(x.perlu)}</td><td>${E(x.cat)}</td><td>${E(x.oleh)}</td><td>${nLamp(x)||'-'}</td></tr>`).join('')}</table></div>${dlb('tmBox','buku-tamu')}</div>
${mine.length?`<div class="card"><h3>🔒 Catatan konseling saya</h3>${mine.map(x=>`<p><b>${E(x.nama)}</b> · ${x.tgl} · ${x.share&&x.share.length?'dibagi ke: '+x.share.join(', '):'hanya saya'} <button class="g" onclick="shareEdit(${x.id})">Atur pembagian</button></p>`).join('')}</div>`:''}
${L.filter(x=>nLamp(x)).map(x=>`<div class="card"><b>${E(x.nama)}</b> · ${x.tgl}<br>${x.foto?`<img class="ft" src="${x.foto}" style="max-width:200px"><br>`:''}${lampHtml(x,!!x.priv)}</div>`).join('')}`}
async function saveTamu(){const r=rhsRead(),x={id:Date.now(),nip:S.u.nip,oleh:S.u.nama,tgl:$('#tg').value,jam:$('#tj').value,nama:$('#tn').value.trim(),hub:$('#th').value,murid:$('#tm').value,kelas:$('#tkl').value,perlu:$('#tk').value,cat:$('#tc').value};if(!x.nama)return toast('Isi nama tamu');if(!rhsOk(r,x.kelas))return;
const lp=await attSave('tamu',r.priv);if(lp===null)return;x.lampiran=lp;
if(r.priv){Object.assign(x,{kind:'tamu',priv:true,share:r.share,alasan:r.al});if(!await T(api('rhsSave',{d:x})))return}else{D.tamu.push(x);save('tamu')}toast('Kunjungan tercatat');vDok()}
function shareEdit(id){const x=RC.find(y=>y.id==id);if(!x)return;$('#shc').innerHTML=`<div class="card"><h3>🔓 Pembagian: ${E(x.nama||x.judul||x.jenis)}</h3><p style="font-size:12px">Hanya untuk keadaan khusus. Wali Kelas hanya melihat jika kelas murid cocok.</p><p>${SH.map(s=>`<label style="margin-right:8px"><input type="checkbox" style="width:auto;margin:0" class="sh2" value="${s}" ${(x.share||[]).includes(s)?'checked':''}> ${s}</label>`).join('')}</p><input id="ta2" placeholder="Alasan keadaan khusus" value="${E(x.alasan||'')}"><button onclick="saveShare(${id})">Simpan</button><button class="g" onclick="$('#shc').innerHTML=''">Tutup</button></div>`;scrollTo(0,0)}
async function saveShare(id){const x=RC.find(y=>y.id==id),sh=[...document.querySelectorAll('.sh2:checked')].map(c=>c.value),al=$('#ta2').value.trim();if(!rhsOk({share:sh,al},x.kelas))return;if(!await T(api('rhsShare',{id,share:sh,alasan:al})))return;toast('Pembagian disimpan');vDok()}
// ===== REKAP (grafik batang mendatar) =====
const hb=a=>{const mx=Math.max(1,...a.map(x=>x[1]));return a.length?a.map(x=>`<div style="display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px"><span style="width:36%;min-width:96px;font-weight:600">${E(x[0])}</span><span style="flex:1;background:#eee;border:2px solid var(--ink);border-radius:6px;height:18px;overflow:hidden"><i style="display:block;height:100%;width:${x[1]/mx*100}%;background:var(--teal)"></i></span><b style="min-width:84px;text-align:right">${x[1]}${x[2]?` <small>(${E(x[2])})</small>`:''}</b></div>`).join(''):'<p><small>Belum ada data.</small></p>'};
async function vRekapBk(){const r=await T(api('bkRekap',{b:rbB}));if(!r){$('#m').innerHTML='<div class="card">Rekap belum bisa dimuat.</div>';return}
const ps=m=>Object.entries(m||{}),bl=Object.keys(r.bulan||{}).sort().map(k=>[k.slice(2),r.bulan[k].sesi]);
$('#m').innerHTML=`<div class="card"><h2>📊 Rekap Layanan BK</h2><p style="font-size:12px">Hanya jumlah dan grafik. Nama murid dan isi masalah tidak ditampilkan. ${r.kelas?'Menampilkan kelas <b>'+E(r.kelas)+'</b> saja (kelas wali kamu).':'Mencakup seluruh sekolah.'}</p><label>Bulan (kosongkan = semua periode)</label><input type="month" value="${rbB}" onchange="rbB=this.value;vDok()">
<div id="rbkBox" class="paper">${kop()}<h3 style="text-align:center">REKAP LAYANAN BIMBINGAN DAN KONSELING<br><small>${E(SK().nama)} · ${rbB||'Semua periode'}${r.kelas?' · Kelas '+E(r.kelas):''}</small></h3>
<table><tr><th>Jumlah layanan</th><th>Murid dilayani (kali)</th><th>Murid unik (kelompok/individual)</th><th>Layanan berbukti lampiran</th></tr><tr><td>${r.sesi}</td><td>${r.peserta}</td><td>${r.unik}</td><td>${r.lamp}</td></tr></table>
<h3>Per jenis layanan</h3>${hb(LAY.map(l=>[l[0].replace(' Layanan ',' '),(r.jenis[l[0]]||{}).sesi||0,((r.jenis[l[0]]||{}).peserta||0)+' murid']))}
<h3>Per bentuk layanan</h3>${hb(BENTUK.map(b=>[b[1],(r.bentuk[b[0]]||{}).sesi||0,((r.bentuk[b[0]]||{}).peserta||0)+' murid']))}
<h3>Per jenis catatan</h3>${hb(KASUSL.map(k=>[k[1],(r.kasus[k[0]]||{}).sesi||0,((r.kasus[k[0]]||{}).peserta||0)+' murid']))}
<h3>Murid dilayani per kelas</h3>${hb(ps(r.perkelas).sort((a,b)=>a[0]<b[0]?-1:1).map(x=>[x[0],x[1].peserta,x[1].sesi+' layanan']))}
<h3>Jumlah layanan per bulan</h3>${bl.length?bars(bl):'<p><small>Belum ada data.</small></p>'}</div>${dlb('rbkBox','rekap-layanan-bk')}</div>`}
async function vRekapKs(){const dk=D.dok.filter(d=>!d.priv&&(!rkB||String(d.tgl).startsWith(rkB))),tm=D.tamu.filter(d=>!d.priv&&(!rkB||String(d.tgl).startsWith(rkB))),cnt=(a,f)=>{const m={};a.forEach(x=>{const k=f(x)||'-';m[k]=(m[k]||0)+1});return Object.entries(m).sort((p,q)=>q[1]-p[1])};
const dla=dk.filter(nLamp).length,tl=tm.filter(nLamp).length,bl=cnt(dk.concat(tm),x=>String(x.tgl).slice(0,7)).sort((a,b)=>a[0]<b[0]?-1:1).slice(-6).map(x=>[x[0].slice(2),x[1]]);
$('#m').innerHTML=`<div class="card"><h2>📈 Rekap Dokumentasi & Buku Tamu</h2><p style="font-size:12px">Untuk Kepala Sekolah. Catatan konseling rahasia guru BK tidak termasuk di sini (lihat tab Rekap Layanan BK).</p><label>Bulan (kosongkan = semua periode)</label><input type="month" value="${rkB}" onchange="rkB=this.value;vDok()">
<div id="rksBox" class="paper">${kop()}<h3 style="text-align:center">REKAP DOKUMENTASI & BUKU TAMU<br><small>${E(SK().nama)} · ${rkB||'Semua periode'}</small></h3>
<table><tr><th>Dokumentasi</th><th>Berlampiran</th><th>Tanpa lampiran</th><th>Kunjungan tamu</th><th>Berlampiran</th><th>Tanpa lampiran</th></tr><tr><td>${dk.length}</td><td>${dla}</td><td>${dk.length-dla}</td><td>${tm.length}</td><td>${tl}</td><td>${tm.length-tl}</td></tr></table>
<h3>Dokumentasi per jenis kegiatan</h3>${hb(cnt(dk,x=>x.jenis))}<h3>Dokumentasi per guru</h3>${hb(cnt(dk,x=>x.oleh).slice(0,10))}<h3>Tamu per hubungan/asal</h3>${hb(cnt(tm,x=>x.hub))}<h3>Aktivitas per bulan (dokumentasi + tamu)</h3>${bl.length?bars(bl):'<p><small>Belum ada data.</small></p>'}</div>${dlb('rksBox','rekap-dokumentasi-tamu')}</div>
<div class="card"><h3>Daftar dokumentasi</h3>${dk.slice().sort((a,b)=>b.id-a.id).map(d=>`<p><b>${E(d.judul)}</b> <small>(${E(d.jenis)} · ${d.tgl} · ${E(d.oleh)})</small> ${lampHtml(d,false)}${d.foto?'<span class="chip">🖼️ foto</span>':''}${nLamp(d)?'':'<span class="chip">tanpa lampiran</span>'}</p>`).join('')||'<p>Belum ada.</p>'}</div>
<div class="card"><h3>Daftar kunjungan tamu</h3>${tm.slice().sort((a,b)=>b.id-a.id).map(d=>`<p><b>${E(d.nama)}</b> <small>(${E(d.hub)} · ${d.tgl} · menemui ${E(d.oleh)})</small> ${lampHtml(d,false)}${d.foto?'<span class="chip">🖼️ foto</span>':''}${nLamp(d)?'':'<span class="chip">tanpa lampiran</span>'}</p>`).join('')||'<p>Belum ada.</p>'}</div>`}

// ===== RPP saja untuk guru mapel =====
async function buatDok(j){const tp=gv('tp').trim();if(!tp)return toast('⚠️ Ketik kondisi kelas atau topik dulu');const btn=$('#b-'+j),old=btn.innerHTML,c=$('#c-'+j);$('#a-'+j).style.display='block';btn.disabled=true;btn.textContent='⏳ Menyeduh…';const stop=wait(c,`Sedang merancang ${j.toUpperCase()} untuk "${E(tp)}"…`);
const dasar=`Saya Guru BK SMP. ${ident()} Isu/kondisi kelas: "${tp}". Keluarkan HANYA HTML murni (tanpa markdown/backtick), gunakan h2/h3, p, ul, ol, table border=1. `;
const P={rpl:dasar+`Buatkan Rencana Pelaksanaan Layanan (RPL) Bimbingan Klasikal 45 menit sesuai Kurikulum Merdeka dan prinsip Pembelajaran Mendalam (berkesadaran, bermakna, menggembirakan). Struktur: Judul layanan (h2), Identitas, Analisis kondisi singkat, Tujuan layanan, Dimensi profil lulusan, Metode A.R.K.A (Aktivitas pemantik, Refleksi, Konseptualisasi, Aplikasi) dengan alokasi waktu tiap tahap, Asesmen, Tindak lanjut. Jangan buat tanda tangan.`,
materi:dasar+`Buatkan HANYA Materi Pendukung yang detail dan mudah dipahami remaja. Struktur: Judul materi (h2), penjelasan komprehensif, contoh kasus, tips praktis. PENTING: sisipkan 1 mind map alur dengan sintaks Mermaid di dalam <div class="mermaid">graph TD; A-->B;</div> (kode mermaid harus valid, label tanpa tanda kurung/kutip).`,
lkpd:dasar+`Buatkan HANYA Lembar Kerja Peserta Didik (LKPD) dan Lembar Refleksi. Struktur: Judul LKPD (h2), identitas siswa (nama, kelas, tanggal), instruksi misi dengan langkah metode A.R.K.A (Aktivitas pemantik, Refleksi, Konseptualisasi, Aplikasi), dan 3 pertanyaan refleksi kritis dengan garis kosong untuk menulis jawaban.`}[j];
try{const h=bersih(await panggilAI(P));stop();c.innerHTML=(j=='rpl'?kop():'')+h+(j=='rpl'?sig():'');if(j=='materi')setTimeout(()=>mm('c-materi'),400);toast('✨ '+j.toUpperCase()+' selesai'+aiT())}catch(e){stop();c.textContent='❌ Gagal: '+e.message}finally{btn.innerHTML=old;btn.disabled=false}}
async function genModul(){if(!gv('rm')||!gv('rmt'))return toast('Isi mapel dan materi');const c=$('#modulBox');$('#a-mod').style.display='block';let sx=$('#modulStat');if(!sx){sx=document.createElement('div');sx.id='modulStat';sx.style.margin='6px 0';c.parentNode.insertBefore(sx,c)}c.innerHTML='';
const base=`Saya guru ${gv('rm')} SMP. ${ident()} Materi: "${gv('rmt')}". Alokasi waktu: ${gv('ral')}. Susun modul ajar sesuai Kurikulum Merdeka dan Pembelajaran Mendalam (berkesadaran, bermakna, menggembirakan; memahami, mengaplikasi, merefleksi). Keluarkan HANYA HTML murni (tanpa markdown/backtick), gunakan h2/h3, p, ul, ol, table border=1. Jangan buat tanda tangan. Tulis HANYA bagian berikut, tanpa bagian lain: `;
const parts=['A. Identitas modul. B. Capaian Pembelajaran, Tujuan Pembelajaran, Dimensi Profil Lulusan, Pemahaman Bermakna, Pertanyaan Pemantik. C. Sarana prasarana, target peserta didik, model dan metode. D. RPP: kegiatan pendahuluan, inti (memahami, mengaplikasi, merefleksi), dan penutup dengan alokasi waktu rinci.','E. Materi ajar lengkap dan mendalam disertai contoh, plus 1 mind map Mermaid di <div class="mermaid">graph TD; A-->B;</div> (valid, label tanpa tanda kurung/kutip). F. LKPD lengkap dengan petunjuk dan soal beserta ruang jawaban.','G. Asesmen (diagnostik, formatif, sumatif) dengan instrumen soal dan rubrik penilaian. H. Pengayaan dan remedial. I. Refleksi guru dan refleksi peserta didik. J. Daftar pustaka.'];
let acc='';for(let i=0;i<3;i++){const stop=wait(sx,`Bagian ${i+1} dari 3 sedang diseduh…`);try{acc+=bersih(await panggilAI(base+parts[i]));stop();c.innerHTML=kop()+acc}catch(e){stop();sx.textContent='❌ Bagian '+(i+1)+' gagal: '+e.message+' — bagian sebelumnya tetap tampil. Tekan tombol lagi untuk mengulang.';return}}
c.innerHTML=kop()+acc+sig();sx.textContent='✨ Modul ajar selesai'+aiT();setTimeout(()=>mm('modulBox'),400)}
async function genRppM(){if(!gv('rm')||!gv('rmt'))return toast('Isi mapel dan materi');const c=$('#rppmBox'),b=$('#b-rppm');$('#a-rppm').style.display='block';b.disabled=true;const stop=wait(c,'Sedang menyeduh RPP…');
const p=`Saya guru ${gv('rm')} SMP. ${ident()} Materi: "${gv('rmt')}". Alokasi waktu: ${gv('ral')}. Buatkan RPP sesuai Kurikulum Merdeka dan pendekatan Pembelajaran Mendalam (berkesadaran, bermakna, menggembirakan; pengalaman belajar memahami, mengaplikasi, merefleksi). Keluarkan HANYA HTML murni (tanpa markdown/backtick), gunakan h2/h3, p, ul, ol, table border=1. Sertakan: identitas, capaian dan tujuan pembelajaran, dimensi profil lulusan, pertanyaan pemantik, sarana, model/metode, kegiatan pendahuluan-inti-penutup dengan alokasi waktu, asesmen, refleksi singkat. Jangan buat tanda tangan.`;
try{const h=bersih(await panggilAI(p));stop();c.innerHTML=kop()+h+sig();toast('✨ RPP selesai'+aiT())}catch(e){stop();c.textContent='❌ Gagal: '+e.message}finally{b.disabled=false}}



init();
</script></body></html>

function sgBold(src){if(!src||String(src).indexOf('data:image/')!=0||SGD.has(src))return Promise.resolve(src);if(SGC.has(src))return SGC.get(src);

let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face},width:{ideal:1280}},audio:false})}catch(e){toast('Kamera langsung tidak bisa dibuka, memakai kamera bawaan perangkat');return attCapFallback(id,face)}

function camX(){if(camS){camS.st.getTracks().forEach(t=>t.stop());camS=null}const d=$('#camOv');if(d)d.remove()}

for(let i=0;i<6;i++){const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bm.width*sc));cv.height=Math.max(1,Math.round(bm.height*sc));const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(bm,0,0,cv.width,cv.height);out=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));if(out&&out.size<=700*1024)break;q=Math.max(.5,q-.1);sc*=.8}
if(bm.close)bm.close();if(out&&out.size<orig){blob=out;tipe='image/jpeg';nama=nama.replace(/\.[^.]+$/,'')+'.jpg'}}
else if(typeof CompressionStream!='undefined'){const z=await new Response(f.stream().pipeThrough(new CompressionStream('gzip'))).blob();if(z.size<orig*.95){blob=z;gz=1}}
const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>no(new Error('Gagal membaca berkas'));r.readAsDataURL(blob)});
return{nama,tipe,gz,orig,size:blob.size,d}}

if(f.size>25*1024*1024){inp.value='';i.textContent='Berkas terlalu besar (maks. 25 MB sebelum kompres). Pakai Google Drive lalu tempel tautannya.';return}
i.textContent='Mengompres berkas…';try{const r=await kompres(f);if(r.size>LKMAX){inp.value='';i.textContent='Masih '+fmtB(r.size)+' setelah dikompres (batas 2,4 MB). Pakai Google Drive lalu tempel tautannya.';return}
LKF=r;const hm=r.orig>r.size?Math.round(100-r.size*100/r.orig):0;i.textContent='✅ '+r.nama+': '+fmtB(r.orig)+' → '+fmtB(r.size)+(hm?' (hemat '+hm+'%)':' (sudah optimal)')}catch(e){inp.value='';i.textContent='Gagal mengompres: '+(e.message||e)}}

const FCH=100000;

const d=f.d,n=Math.max(1,Math.ceil(d.length/FCH));nf.n=n;for(let i=0;i<n;i++){const t=$('#lki');if(t)t.textContent='⏳ Mengunggah '+(i+1)+' dari '+n+'…';await fchunk('link-'+nf.fid+'.'+i,d.slice(i*FCH,(i+1)*FCH))}

for(let i=0;i<f.n;i++){let p=null;for(let t=0;t<3&&typeof p!='string';t++){try{p=await fj(S.url+'?k='+encodeURIComponent('f:link-'+f.fid+'.'+i)+skq(),60000)}catch(e){await jeda(1000)}}if(typeof p!='string')throw new Error('Potongan berkas '+(i+1)+' dari '+f.n+' gagal diambil. Coba lagi.');parts.push(p)}
return{n:m.n,t:m.t,gz:m.gz,d:parts.join('')}}
